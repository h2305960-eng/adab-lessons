/* ===== العجلة + التكبير + المصطلحات ===== */
function rotateWheel(g,inst){var o=QS[g],w=o.wheel;if(!o||o.selP<0)return;if(inst){w.style.transition='none';Array.prototype.forEach.call(w.querySelectorAll('.card-in'),function(c){c.style.transition='none';});}w.style.setProperty('--rot',(-o.selP*o.step)+'deg');Array.prototype.forEach.call(w.querySelectorAll('.card-in'),function(c,i){c.classList.toggle('sel',i===o.selP);});if(inst){void w.offsetWidth;w.style.transition='';Array.prototype.forEach.call(w.querySelectorAll('.card-in'),function(c){c.style.transition='';});}o.pointer.classList.remove('bounce');void o.pointer.offsetWidth;o.pointer.classList.add('bounce');}
function showZoom(g,i){var o=QS[g],nm=imgSrc(o.sec+1,o.qi+1,i+1);var img=o.zoomimg;img.setAttribute('data-name',imgKey(o.sec+1,o.qi+1,i+1));img.onerror=function(){img.onerror=null;img.src=phSrc(img.getAttribute('data-name'));};img.src=nm;o.zoomtxt.textContent=SECTIONS[o.sec].qs[o.qi].a[i];o.zoombadge.textContent='فقرة '+arNum(i+1)+' من '+arNum(o.segs.length);o.zoomframe.classList.add('show');}
function selectSeg(g,i){var o=QS[g];o.selP=i;o.seen[i]=true;o.segs.forEach(function(s,si){s.classList.toggle('act',si===i);s.classList.toggle('seen',!!o.seen[si]);});o.cap.innerHTML='العبارة <b>'+arNum(i+1)+'</b> من '+arNum(o.segs.length);rotateWheel(g,false);showZoom(g,i);updateProgress();}
var tip=document.getElementById('tip');
function openTip(ti,si,anchor){var tm=SECTIONS[si].terms[ti];if(!tm)return;document.getElementById('tipT').textContent=tm.t;document.getElementById('tipD').textContent=tm.d;var r=anchor.getBoundingClientRect();tip.classList.add('show');var tw=tip.offsetWidth,th=tip.offsetHeight;var x=r.left+r.width/2-tw/2,y=r.top-th-10;x=Math.max(10,Math.min(innerWidth-tw-10,x));if(y<70)y=r.bottom+10;tip.style.left=x+'px';tip.style.top=y+'px';}
document.addEventListener('click',function(e){if(!e.target.closest('.term')&&!e.target.closest('#tip'))tip.classList.remove('show');});
var drawer=document.getElementById('drawer');
function fillDrawer(si){document.getElementById('dTitle').textContent='مصطلحات · '+SECTIONS[si].name;var L=document.getElementById('dList');L.innerHTML='';SECTIONS[si].terms.forEach(function(tm,ti){var d=document.createElement('div');d.className='ditem';d.innerHTML='<button class="dterm">'+esc(tm.t)+'<span class="car">‹</span></button><div class="ddef"><div>'+esc(tm.d)+'</div></div>';d.querySelector('.dterm').onclick=function(){d.classList.toggle('open');};L.appendChild(d);});}
document.getElementById('dClose').onclick=function(){drawer.classList.remove('open');};
function currentSection(){var m=slideMeta[idx];return (m&&m.sec!==undefined)?m.sec:0;}
/* ===== التقدم + التنقل ===== */
var fillEl=document.getElementById('fill'),orbEl=document.getElementById('orb');
function updateProgress(){var done=0;QS.forEach(function(o){if(o)done+=Object.keys(o.seen).length;});var pct=Math.round(done/totalSeg*100);
 document.getElementById('pct').textContent=arNum(pct)+'٪';
 var np=document.getElementById('npPct');if(np)np.textContent='التقدم: '+arNum(pct)+'٪';
 fillEl.style.height=pct+'%';orbEl.style.bottom=pct+'%';
 if(idx===N-1){document.getElementById('endPct').textContent=arNum(pct)+'٪';document.getElementById('endFill').style.width=pct+'%';document.getElementById('endMsg').textContent=pct===100?'أتقنت جميع العبارات 🏆':pct>=60?'تقدم رائع 🌟':'عُد والمس العبارات 📖';}}
var idx=0;
function goTo(n){n=Math.max(0,Math.min(N-1,n));var ts=secOf(n);
 if(ts>=1&&ts<=SECTIONS.length-1&&!solved[ts-1]){toast('🔒 حُلّ لغز باب «'+SECTIONS[ts-1].name+'» أولًا!');return;}
 if(ts===SECTIONS.length&&!solved[SECTIONS.length-1]){toast('🔒 أكمل الألغاز أولًا!');return;}
 idx=n;visited[idx]=true;deck.style.setProperty('--idx',idx);
 slides.forEach(function(s,i){s.classList.toggle('act',i===idx);});
 document.getElementById('wm').textContent=slideMeta[idx].wm;
 clearParallax();updateProgress();refreshLocks();
 if(drawer.classList.contains('open'))fillDrawer(currentSection());}
function clearParallax(){slides.forEach(function(s){var q=s.querySelector('.qinner');if(q)q.style.transform='';});}
var sx=null,dragX=0,dragging=false,hInt=null,wasDrag=false,lastT=0,vel=0;
document.addEventListener('pointerdown',function(e){
 if(e.target.closest('.jz-piece,.tlcard,.sjpiece,.scard,.jz-veil.show,.quiz-veil.show,.drawer.open,.navPanel,.edgeMenu,input,textarea,select'))return;
 sx=e.clientX;dragX=0;dragging=false;hInt=null;vel=0;lastT=Date.now();deck.classList.remove('anim');
},true);
addEventListener('pointermove',function(e){if(sx===null)return;var dx=e.clientX-sx;if(hInt===null){if(Math.abs(dx)<12)return;hInt=true;}dragging=true;var d=dx;if((idx===0&&d>0)||(idx===N-1&&d<0))d=d/3;deck.style.setProperty('--drag',d+'px');var now=Date.now();if(now-lastT>0)vel=(dx-dragX)/(now-lastT);lastT=now;dragX=dx;var a=slides[idx].querySelector('.qinner');if(a)a.style.transform='translateX('+(dx*.12)+'px)';});
document.addEventListener('pointerup',function(e){if(sx===null)return;sx=null;deck.classList.add('anim');deck.style.setProperty('--drag','0px');
 if(dragging){var flick=Math.abs(vel)>0.4;if(Math.abs(dragX)>40||flick)goTo(idx+(dragX>0?1:-1));wasDrag=true;setTimeout(function(){wasDrag=false;},90);dragging=false;}
 clearParallax();},true);
deck.addEventListener('click',function(e){if(wasDrag){e.preventDefault();e.stopPropagation();}},true);
addEventListener('keydown',function(e){if(e.key==='Escape'){drawer.classList.remove('open');tip.classList.remove('show');document.getElementById('navPanel').classList.remove('open');closeEM();eqVeil.classList.remove('show');metaVeil.classList.remove('show');examVeil.classList.remove('show');QS.forEach(function(o){if(o)o.zoomframe.classList.remove('show');});document.body.classList.remove('immersive');}else if(e.key==='f'||e.key==='F')toggleFS();else if(e.key==='ArrowRight')goTo(idx+1);else if(e.key==='ArrowLeft')goTo(idx-1);else if(e.key==='Home')goTo(0);else if(e.key==='End')goTo(N-1);});
document.getElementById('replay').onclick=function(){goTo(0);};
document.addEventListener('pointerdown',function(e){var t=e.target.closest('.press,.seg,.term,.fab,.em-item,.card-in');if(!t)return;var r=t.getBoundingClientRect(),d=Math.max(r.width,r.height);var sp=document.createElement('span');sp.className='ripple';sp.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';t.appendChild(sp);setTimeout(function(){sp.remove();},650);});
/* ===== الحروف الطائرة ===== */
var chars='مطرخليج نخيل ضوء'.replace(/\s+/g,'').split('');
var letterCount=(innerWidth<760?8:16);
for(var ci=0;ci<letterCount;ci++){var le=document.createElement('div');le.className='lt';le.textContent=chars[Math.floor(Math.random()*chars.length)];
 var szV=(4+Math.random()*5);
 le.style.cssText='width:'+szV+'vmin;height:'+szV+'vmin;font-size:'+(szV*.5)+'vmin;left:'+(Math.random()*95)+'%;animation-duration:'+(18+Math.random()*24)+'s;animation-delay:-'+(Math.random()*26)+'s';
 document.getElementById('letters').appendChild(le);}
/* ===== مشغّلات الاختبار الشامل (قائمة 🎛 + شريحة الختام) ===== */
(function(){
 var em=document.getElementById('edgeMenu');
 var b=document.createElement('button');b.className='em-item';b.innerHTML='<span class="ic">🎓</span>اختبار شامل';
 b.onclick=function(){closeEM();startExam();};
 var sep=em.querySelector('.em-sep');if(sep)em.insertBefore(b,sep);else em.appendChild(b);
 var end=deck.querySelector('.end');
 if(end){var eb=document.createElement('button');eb.className='ebtn press';eb.style.marginInlineStart='.5rem';eb.textContent='🎓 اختبار شامل نهائي';eb.onclick=startExam;end.appendChild(eb);}
})();
/* ===== الإقلاع ===== */
gateSlides.forEach(function(g,si){renderGate(si);});
refreshLocks();
applyScale();
(function(){var s=null;try{s=localStorage.getItem(MODE_KEY);}catch(e){}applyMode(s&&MODES[s]?s:detectMode());})();
goTo(0);
addEventListener('load',function(){if(!deck.children.length){document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;z-index:99998;background:#fff;color:#a00;display:flex;align-items:center;justify-content:center;font-family:monospace">لم يُبنَ المحتوى — راجع رسالة الخطأ أسفل الشاشة</div>');}});
</script>
</body>
</html>
