.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);z-index:120;padding:1rem;background:rgba(255,245,247,.7);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-right:1px solid var(--gbd2);transform:translateX(-105%);transition:transform .5s;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}

.courtpara{background:rgba(255,245,247,.6);border:1px solid var(--gbd);border-radius:12px;padding:.7rem .9rem;font-size:.8rem;line-height:2.1;color:var(--ink);text-align:right}

.plate{position:relative;flex:1;min-height:120px;border:2px dashed rgba(232,160,191,.5);border-radius:14px;background:rgba(232,160,191,.06);padding:1.9rem .4rem .4rem;text-align:center;cursor:pointer}

.mod-spin .sjtray>*:nth-child(even),.mod-spin .tltray>*:nth-child(even){transform:rotate(2.5deg)}

.qz-opts{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:.5rem}
.qz-opt{border:1px solid var(--gbd);background:rgba(255,245,247,.55);border-radius:12px;padding:.6rem .9rem;cursor:pointer;font-family:'Tajawal';font-weight:600;color:var(--ink);text-align:right}

.mn{font-weight:800;color:var(--ink)}
.ms{color:var(--ink2);font-weight:700}
.jz-head{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:.6rem;-webkit-flex-wrap:wrap;flex-wrap:wrap}

{q:'وضح: (لم تكن الحياة الأدبية بمعزل عن الحياة السياسية...). أكانت الحياة الأدبية بمعزل؟ كيف واكب الشعر العربي والفلسطيني أحداث القضية؟',key:1,note:'📝 للمناقشة · نمط آخر: ما الَّذي دعَا إليهِ شعرُ القضيةِ الفلسطينيةِ؟ يبدأ من (إذ نظم شعراء العرب...)',a:[

{q:'ما أثر قرار تقسيم فلسطين في التأريخ المعاصر؟ لماذا كان قرار التقسيم عام 1947 أكثر إثارة لمشاعر الشعراء؟',key:0,note:'📝 للمناقشة',a:[

{q:'عرف شعر المقاومة الفلسطينية؟ وما الوظيفة التي يؤديها هذا النوع من الشعر؟ ما المقصود بشعر المقاومة؟',key:0,note:'📝 وزاري 2023/ت · وزاري 2024/3 (أدبي): ما المقصود بـ (شعر المقاومة)؟',a:[

{q:'ناقش هذه العبارة: (فالأديب ابن بيئته والناطق باسمها، وكلمته هي سلاحه...). متى يكون الأديب صادقا؟',key:1,a:[

{q:'إلام يتوجه النص في قصيدة فدوى طوقان في صورته الأولى؟ من المخاطب في قصيدة (صلاة إلى العام الجديد)؟',key:0,a:[

{q:'عمدت الشاعرة إلى تصوير العام الجديد بصورة جديدة (وضح ذلك).',key:0,note:'📝 وزاري 2023/ت · للمناقشة',a:[

{q:'ماذا كانت قرابين فدوى طوقان في قصيدتها؟ ناقش: في قصيدة فدوى طوقان طاقة تعبيرية إيجابية تفوح أملا وتفاؤلا لكن الشاعرة ترددت.',key:1,note:'📝 للمناقشة',a:[
'ولكنَّ تلكَ القرَابِيْنَ ليستْ كأيِّ قرابينَ، فهيَ قرابينُ ألحانٍ وغناءٍ تَمتَزِجُ بتسابيحِ الدُّموعِ،',

 function runRound(){
   var r=EXAM.rounds[ri];
   var items=r.items.slice().sort(function(a,b){return (a.level||1)-(b.level||1);});
   var ii=0,rg=0;max+=rMax(r);
   function item(){
     var it=items[ii],lv=it.level||1,optsArr=[],correct='';
     if(r.type==='fill'){optsArr=shuffle(buildFillBank(r.items,it).map(function(w){return{t:w,ok:w===it.a};}));correct=it.a;}

     var locked=false;

        if(locked)return;locked=true;
        var ok=optsArr[+b.getAttribute('data-i')].ok;

     };});

   }

 }

document.addEventListener('pointerdown',function(e){var t=e.target.closest('.press,.seg,.term,.fab,.em-item,.card-in');if(!t)return;var r=t.getBoundingClientRect(),d=Math.max(r.width,r.height);var sp=document.createElement('span');sp.className='ripple';sp.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';t.appendChild(sp);setTimeout(function(){sp.remove();},650);});
/* ===== الحروف الطائرة ===== */
var chars='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');
var letterCount=(innerWidth<760?8:16);
for(var ci=0;ci<letterCount;ci++){var le=document.createElement('div');le.className='lt';le.textContent=chars[Math.floor(Math.random()*chars.length)];
 var szV=(4+Math.random()*5);
 le.style.cssText='width:'+szV+'vmin;height:'+szV+'vmin;font-size:'+(szV*.5)+'vmin;left:'+(Math.random()*95)+'%;animation-duration:'+(18+Math.random()*24)+'s;animation-delay:-'+(Math.random()*26)+'s';
 document.getElementById('letters').appendChild(le);}
/* ===== الإقلاع ===== */
gateSlides.forEach(function(g,si){renderGate(si);});
refreshLocks();
applyScale();
(function(){var s=null;try{s=localStorage.getItem(MODE_KEY);}catch(e){}applyMode(s&&MODES[s]?s:detectMode());})();
goTo(0);
addEventListener('load',function(){if(!deck.children.length){document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;z-index:99998;background:#fff;color:#a00;display:flex;align-items:center;justify-content:center;font-family:monospace">لم يُبنَ المحتوى — راجع رسالة الخطأ أسفل الشاشة</div>');}});
</script>
