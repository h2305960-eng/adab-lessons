{q:'ما الشكوى؟ وما علاقة الشعر بها؟',key:0,a:['الشَّكوى مَيْلٌ فطريٌّ لدى الإنسانِ، يلجأُ إليهِ عِنْدَ الشُّعورِ بالألمِ أو الحزنِ أو اليأسِ، أو عندَ الإحساسِ بالاضطهادِ والظّلمِ.','إنَّ الشِّعرَ مرتبطٌ بالشُّعورِ الَّذي يُثارُ في تجربةٍ ذاتيةٍ أو عبر تجربةٍ ينفذُ فيهَا إلى مسائلِ الكونِ أو مشكلةٍ منْ مشكلاتِ المجتمعِ.']},

{q:'كيف تناول حافظ إبراهيم غرض الشكوى؟',key:0,a:['ولمْ يَكُنْ حَافظٌ بمنأًى عنْ هذا الغرضِ، إذْ كتبَ فيهِ قصائدَ عدَّةً بثَّ فيها ما يَعتَلِجُ في نفسِهِ منْ همومٍ وآلامٍ،','منها قصيدةُ (حَسْرةٍ على فائتٍ).']},

{q:'علام يحرص حافظ إبراهيم؟ كيف أظهر ملامح الشكوى في قصيدته؟',key:1,a:['ويحرصُ على إظهارِ ملامحِ الشَّكوى عبر التَّغني بالماضي وتوظيفِ ما يمكنُ توظيفه من التراكيبِ البنائيةِ في النَّصِّ،','فمثلاً يوظِّفُ صيغةَ الماضي في خبرِهِ الذي يستهلُّ فيهِ القصيدةَ.']},

{q:'لماذا وظَّفَ الشاعرُ صيغةَ الماضي في استهلالِ قصيدتِهِ؟ وما الفرقُ بينَ التَّعبيرين (لمْ يَبقَ) و (مَا بَقِيَ)؟',key:0,a:['إجابة السؤالين السابقين (لتأكيد الحقيقة المؤلمة، وأداة النفي "لم" تقلب الدلالة الزمنية للفعل المضارع من الحاضر إلى الماضي، ونفيها مؤكد بذاته).']},
{q:'ما دلالةُ الفعلِ الماضي النَّاقصِ (كانَ) في سياقِ قصيدةِ حافظ إبراهيم؟ كيف عبَّر عما كانت عليه الأمة؟',key:1,a:['ثمَّ يَعْمَدُ إلى توظيفِ الفعلِ الماضي؛ ولاسيما (كانَ) في غيرِ موضعٍ؛ لِيقدمَ مقدارَ تعلُّقِهِ بماضيهِ وقيمهِ القوميةِ وتغنِّيهِ بالماضي المجيدِ،','وما كانتْ عليهِ الأُمَّةُ منْ سؤددٍ ورفعةٍ وشموخٍ معبِّرًا عنْ ذلكَ في استعمالِهِ أَلفاظَ (العُلا، المجرةِ، الشُّهُبِ)، مدعُومًا بتصويرِ القوَّةِ والمنعةِ في مواجهةِ الأعداءِ.']},

]}

function highlight(text,terms){var rest=text,out='';var list=terms.slice().sort(function(a,b){return b.t.length-a.t.length;});

  for(var k=0;k<list.length;k++){var ix=rest.indexOf(list[k].t);if(ix>-1&&(!best||ix<best.ix))best={ix:ix,tm:list[k],idx:terms.indexOf(list[k])};}
  if(!best){out+=esc(rest);break;}
  out+=esc(rest.slice(0,best.ix))+'<span class="term" data-ti="'+best.idx+'">'+esc(best.tm.t)+'</span>';
  rest=rest.slice(best.ix+best.tm.t.length);}
 return out;}

 else if(a==='zout'){scaleMode='manual';kScale=clampN(kScale/1.12,0.6,1.6);applyScale();toast('➖ تصغير يدوي: '+Math.round(kScale*100)+'٪');}
 else if(a==='m-phone'){setMode('phone');closeEM();}
 else if(a==='m-tablet'){setMode('tablet');closeEM();}
 else if(a==='m-present'){setMode('present');closeEM();}
});
function wheelRadius(n){var f=1;if(currentMode==='phone')f=.72;if(currentMode==='present')f=1.18;return Math.min(60+n*14,130)*f;}

function _applyModeBase(m){currentMode=m;document.body.classList.remove('mode-phone','mode-tablet','mode-present');document.body.classList.add('mode-'+m);updateWheels();updateProgress();applyScale();}

function fsActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement);}
function lockLand(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});}catch(e){}}
function enterFS(){var el=document.documentElement;
 var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
 if(!req)return false;
 try{var p=req.call(el);
  if(p&&p.then){p.then(lockLand).catch(function(){goImmersive();});}
  else lockLand();
  return true;
 }catch(e){return false;}}
function exitFS(){var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen;
 if(ex){try{ex.call(document);}catch(e){}}}

 g.innerHTML='<div style="background:#fff;border-radius:18px;max-width:430px;padding:22px;font-family:Tajawal,sans-serif;text-align:center;color:#3B0764">'
 +'<div style="font-size:2.2rem">📱</div><h3 style="margin:.4rem 0;font-size:1.1rem">الملء الكامل على الآيفون</h3>'
 +'<p style="font-size:.85rem;line-height:1.9;color:#581C87">كل متصفحات الآيفون (حتى كروم) <b>ممنوعة</b> من ملء الشاشة بقرار من آبل.<br><b>الحل الوحيد لملء حقيقي:</b><br>١) افتح التطبيق من رابط خارجي (ليس Apps Script)<br>٢) مشاركة <b>⤴</b> ← <b>إضافة إلى الشاشة الرئيسية</b><br>٣) افتحه من الأيقونة → ملء كامل بلا أشرطة.</p>'
 +'<button id="iosGuideOk" style="margin-top:.6rem;background:linear-gradient(120deg,#6B21A8,#581C87);border:none;color:#fff;font-family:Tajawal,sans-serif;font-weight:800;padding:.6rem 1.6rem;border-radius:12px;cursor:pointer">فهمت ✨</button></div>';
 document.body.appendChild(g);

function goImmersive(){document.body.classList.add('immersive');
 setTimeout(function(){window.scrollTo(0,1);},120);
 toast(isIOS||IN_FRAME?'✨ وضع الملء الذكي مفعّل\nسفاري الآيفون لا يدعم ملء الشاشة الويبّي':'✨ وضع الملء الذكي مفعّل');
 if(isIOS)iosGuide();}
function stopImmersive(){document.body.classList.remove('immersive');}
function toggleFS(){
 if(fsActive()){exitFS();stopImmersive();return;}
 if(document.body.classList.contains('immersive')){stopImmersive();return;}
 if(!isIOS&&!IN_FRAME&&fsSupported()){
  if(enterFS())return;
 }
 goImmersive();
}

function rotateWheel(g,inst){var o=QS[g],w=o.wheel;if(!o||o.selP<0)return;if(inst){w.style.transition='none';Array.prototype.forEach.call(w.querySelectorAll('.card-in'),function(c){c.style.transition='none';});}w.style.setProperty('--rot',(-o.selP*o.step)+'deg');Array.prototype.forEach.call(w.querySelectorAll('.card-in'),function(c,i){c.classList.toggle('sel',i===o.selP);});if(inst){void w.offsetWidth;w.style.transition='';Array.prototype.forEach.call(w.querySelectorAll('.card-in'),function(c){c.style.transition='';});}o.pointer.classList.remove('bounce');void o.pointer.offsetWidth;o.pointer.classList.add('bounce');}

 if(ts>=1&&ts<=SECTIONS.length-1&&!solved[ts-1]){toast(' حُلّ لغز قسم «'+SECTIONS[ts-1].name+'» أولًا!');return;}
 if(ts===SECTIONS.length&&!solved[SECTIONS.length-1]){toast('🔒 أكمل الألغاز أولًا!');return;}
