.jz-strip{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:.5rem;min-height:70px}
.jz-slot{position:relative;-webkit-flex:1 1 160px;flex:1 1 160px;min-height:64px;border:2px dashed rgba(74,124,89,.5);border-radius:12px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:.6rem .9rem;color:rgba(74,124,89,.6);font-weight:800;font-size:.8rem;background:rgba(74,124,89,.05);cursor:pointer}
.jz-slot .num{position:absolute;top:4px;right:8px;font-size:.65rem;opacity:.7}
.jz-slot.filled{border-style:solid;border-color:#22c55e;background:rgba(34,197,94,.12);color:var(--ink);cursor:default;font-weight:700;font-size:.82rem;line-height:1.6}
.jz-slot.filled::after{content:'';position:absolute;left:-9px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:rgba(34,197,94,.25);border:2px solid #22c55e}
.jz-traylabel{font-size:.7rem;font-weight:700;color:var(--ink3)}
.jz-tray{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:.5rem;min-height:60px}
.jz-piece{position:relative;border:1px solid var(--gbd);background:linear-gradient(135deg,#faf3dd,#c8d5b9);border-radius:12px;padding:.8rem .9rem .5rem;cursor:grab;font-family:'Tajawal';font-weight:700;font-size:.8rem;color:var(--ink);touch-action:none;max-width:230px}
.jz-piece::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:inherit;border:1px solid var(--gbd)}
.jz-piece.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(104,176,171,.35)}
.jz-piece.lifting{opacity:.35}
.jz-ghost{position:fixed;z-index:500;pointer-events:none;opacity:.95;transform:scale(1.06)}
.jz-reveal{background:rgba(34,197,94,.1);border:1px solid #22c55e;border-radius:12px;padding:.7rem 1rem;font-weight:600;line-height:2;font-size:.9rem}
.jz-final{text-align:center;padding:1rem 0}.jz-final .big{font-size:2.4rem;font-weight:900;color:var(--gold2)}.jz-final p{font-weight:700;color:var(--ink2);margin:.4rem 0 .8rem;line-height:2}
.jz-final button{margin:0 .3rem;width:auto;border-radius:12px;padding:.5rem 1.2rem}
.celebrate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:500;pointer-events:none}
.celebrate span{position:absolute;font-size:2rem;animation:cpop 1.4s ease forwards}

var POET_SUM=[
'هو محمد مهدي بن الشيخ عبد الحسين الجواهري.',
'من أسرة عريقة اشتهرت بالزعامة الدينية من عهد مؤسسها الشيخ محمد حسن صاحب كتاب (جواهر الكلام).',
'وُلد في مدينة النجف الأشرف عام 1899م، المدينة التي كانت تزدحم بالمجالس العلمية والأدبية.',
'درس وهو في سن السابعة في الكتاتيب في النجف الأشرف، اتجه بعد ذلك كما يتجه كل أفراد أسرته منذ حداثته لدراسة علوم اللغة والمنطق والفقه وأصوله.',
'كان بيت الجواهري بيت علم وشعر وأدب، شأنه شأن بيوت كثيرة في النجف آنذاك، فقرأ لكبار الشعراء وحفظ شعرهم وتأثر بهم منذ حداثته، وقيل إنه حفظ ديوان المتنبي كله، وقسمًا كبيرًا من شعر غيره من مشاهير الشعراء القدماء، والتقى أحب الشعراء إلى قلبه الشاعر محمد سعيد الحبوبي في بيت أسرته.',
'كان للإرث الثقافي وتلك البيئة وعشقه للشعر وتعلقه بالشعراء أثر كبير في تكوين شخصيته الأدبية ونضجه الفني وارتقائه القمة.',
'لُقّب بـ(شاعر العرب الأكبر) من دون منازع، وكذلك لُقّب بـ(نهر العراق الثالث).',
'يرى النقاد أن الجواهري أكبر شاعر صور حياة العراق السياسية المضطربة في شعره منذ حقبة العشرينيات من القرن الماضي.',

'تُوفي الجواهري في دمشق عام 1997م ودُفن فيها.'
];

'فقدْ عَمَدَ الجواهريُّ في القصيدةِ هذهِ إلى إظهارِ فلسفةِ النهضةِ الحسينيةِ وأهدافِهَا وأبعادِهَا وثمراتِهَا.']},
{q:'كيف يُعلن الجواهري إمكانية القارئ من صنع المعنى؟',key:1,a:[
'يُعلنُ الجواهريُّ فيها إمكانيةَ القارئِ من صنعِ المعنى منذُ بدءِ القصيدةِ، فيقومُ بإيجازٍ مبدعٍ عبر حذفِ المبتدأ لِينفتحَ مجالُ التَّأويلِ، ويبدأُ التَّساؤلُ، بمَنِ افْتَدَى الشَّاعرُ الضَّريحَ الذي تنَّورَ بنورِ الحسينِ (عليهِ السَّلامُ)، وتَعَطَّرَ بطيبهِ حتَّى غدا أَعبقَ منْ نفحاتِ الجنانِ؟ أهو الشَّاعرُ نفسُهُ، فيكونُ التقديرُ (أنا فداءٌ) أمْ غيرُهُ؟',
'ثمَّ يتوَالى الحذفُ في مطلعِ القصيدةِ؛ إذ يُركِّبُ الشَّاعرُ صوَرَهُ بحذفِ (الفعلِ) مُبقيًا على مصدرِهِ (المفعولِ المطلقِ) (رعيًا، سقيًا، حزنًا، صونًا).']},
{q:'ما دلالة (رعيًا) و(سقيًا) في القصيدة؟',key:0,a:[
'نقلَ (رعيًا) من دلالتِهَا الماديةِ إلى الدَّلالةِ المعنويةِ المتمثلةِ باستيعابِ المفاهيمِ المستوحاةِ من ملحمةِ الطَّفِّ الخالدةِ والقيمِ الإنسانيةِ التي تمخَّضَتْ عنْ موقفِ التَّضحيةِ والفداءِ والايثارِ، وقدْ وظَّفَ لهذا النَّقلِ الاستعارةَ،',
'وأمَّا (سقيًا) فمنِ السُّقيا وهيَ دعاءُ المحبِّينَ لنزولِ الماءِ ذلكَ الذي حُرِمَ منهُ سبطُ رسولِ اللهِ (صلى اللهُ عليهِ وآله وسلم).']},
{q:'ما دلالة (حزنًا وصونًا) في القصيدة؟',key:0,a:[
'وأَمَّا (حزنًا وصونًا) فقد جاءا توكيدا للتمسُّكِ بنهجِ الإمام الحسين (عليه السلام) النِّيِّرِ في مواجهةِ الطُّغيانِ',
'والحفاظِ على قيمِ العدلِ والحريةِ.']},
{q:'أجوبة آخر ثلاثة أسئلة.',key:0,a:[
'أجوبة آخر ثلاثة أسئلة.']},
{q:'كيف أفصح الجواهري عمَّا قدَّمه في مطلع القصيدة؟',key:1,a:[
'وبانتقالٍ ذكي منْ أسلوبِ الخبرِ إلى الخطابِ المباشرِ عبْر أسلوبِ النداءِ يُفصحُ الشَّاعرُ عمَّا قدَّمهُ في مطلعِ القصيدةِ، فالحسينُ (عليهِ السَّلامُ) وِتْرٌ لمْ تَجُدِ الدُّنيا بمثلِهِ ولنْ تجودَ، و(عِظةُ الطَّامحينَ العِظامِ) لأولئكَ (اللاهينَ عن غدهِمِ)، وهو المتعالي على الظَّالمينَ والطُّغاةِ ومُفْزِعُهُم،',
'وفي الوقتِ نفسِهِ قبرُهُ ملاذٌ تَفزعُ إليهِ النُّفوسُ الباحثةُ عنِ الطُّمأنينةِ والسَّلامِ والتَّحدي.']},
{q:'كيف يعود الجواهري في قصيدته بمشاعر إنسانية دافقة؟',key:0,a:[
'يعودُ الجواهريُّ في قصيدتهِ بمشاعرَ إنسانيةٍ دافقةٍ مستدعيًا المكانَ لِتقديسِ الصُّمودِ والثَّباتِ، فمِنِ الأرضِ الَّتي ضمَّتِ الجسدَ الطَّاهرَ ينبعثُ نسيمُ العزَّةِ والكرامةِ والإباءِ،',
'فيَشمه منْ أرادَ الحريَّةَ، وفي ثراهَا يُعفِّرُ خدَّهُ منْ يريدُ الثبات.']}
]},

{q:'مَن أسَّسَ مدرسة المهجر؟ ومِن أين ينحدر أعضاؤها؟',key:0,a:[
'أسّسَها الشّعراءُ والأدباءُ العربُ في مهجرِهِم خارجَ بلدانِهِم العربيّةِ،',
'ومعظمُهُمْ ينحدرُ مِنْ بلادِ الشَّامِ (سوريا ولبنانَ).']},
{q:'مِمَّ تتألف مدرسة المهجر؟',key:0,a:[
'تتألف مدرسة المهجر مِنْ مهجرينِ اثنينِ؛ أحدُهُما المهجرُ الشّماليُّ الذي نشأَ عامَ 1920 بالرّابطةِ القلميّةِ وهي جمعية أدبية ترأسَها الشّاعرُ الأديبُ جبران خليل جبران في الولاياتِ المتحدةِ الأمريكيّةِ، وشاركَهُ في عضويتِها ميخائيل نعيمة وإيليا أبو ماضي، وأصدروا مجلّةَ (السائحِ) ومجلة (السمير) لإظهارِ إبداعاتِهم الأدبيّةِ في المهجرِ.',
'والآخرُ المهجرُ الجنوبيُّ، وهوَ العُصْبَةُ الأندلسيّةُ التي هي أيضًا جمعية أدبيَّة أسّسَها الشّعراءُ في دولِ أمريكا الجنوبيّةِ، برئاسةِ ميشيل معلوف وإلى جانبِهِ شفيق المعلوف ورشيد سليم الخوري وسواهم.']},
{q:'ما أهم خصائص مدرسة المهجر الموضوعية؟',key:0,a:[
'ومن أهمِّ خصائصِ مدرسةِ المهجرِ الموضوعيّةِ: تصويرُ الحنينِ إلى الوطنِ، والحوارُ معَ الطّبيعةِ والامتزاج بها،',
'والتّأملُ الذّاتيّ وتحليلُ النّفسِ الإنسانيّةِ،',
'ونشرُ المبادئِ الساميةِ.']},
{q:'ما أهم خصائص مدرسة المهجر الفنية؟',key:0,a:[
'ومِنَ الناحيةِ الفنيّةِ: التمرّدُ على الغرابةِ، وعدمُ التكلّف في اللُّغةِ المستخدمةِ،',
'والحرصُ على توظيفِ اللُّغةِ الحيّةِ المتمثّلةِ بسلاسةِ الألفاظِ، وبساطةِ التراكيبِ، وجمالِ التصويرِ.']},
{q:'إجابة آخر سؤالين.',key:0,a:[
'إجابة آخر سؤالين.']},
{q:'كيف مثّلت مدرسة المهجر مبادئ النزعة الرومانسية؟',key:0,a:[
'فكانتْ مدرسةُ المهجرِ بهذهِ الخصائصِ الموضوعيّةِ والفنيّةِ تمثيلا أمينًا لمبادئِ النّزعةِ الرُّومانسيّةِ في الشِّعرِ والأدبِ.']}
]},
{name:'ميخائيل نعيمة · السيرة',icon:'📖',wm:'نعيمة',theme:'poet',terms:[
{t:'الرابطة القلمية',d:'جمعية أدبية أسسها جبران خليل جبران في نيويورك عام 1920.'}],qs:[
{q:'أين ومتى وُلد ميخائيل نعيمة؟',key:0,a:[
'وُلِدَ ميخائيل نعيمة الأديبُ والشّاعرُ اللّبنانيُّ',
'في جبلِ صنّينَ بلبنانَ عامَ 1889 م.']},
{q:'ما مكانة ميخائيل نعيمة الأدبية؟',key:0,a:[
'وكانَ مِنْ أبرزِ شُعراءِ المهجرِ الذينَ شكّلوا الرّابطةَ القلميّةَ في نيويورك.',
'يُعَدُّ مِن أهمِّ روادِ المدرسةِ الأدبيّةِ الحديثةِ في القرنِ العشرينَ.']},
{q:'أين عاش ميخائيل نعيمة حياته؟',key:0,a:[
'عاشَ حياتَهُ بينَ الولاياتِ المتحدةِ ولبنانَ.']},
{q:'ما تنوع كتابات ميخائيل نعيمة؟',key:0,a:[
'وتنوّعتِ الكتاباتُ التي قدّمَها بينَ المسرحِ والفلسفةِ والشّعرِ والنّقدِ.',
'لهُ الكثير مِنَ المؤلفاتِ باللُّغتينِ العربيّةِ والإنجليزيّةِ.']},
{q:'ما الذي أضفى نكهة خاصة على أسلوب نعيمة؟',key:0,a:[
'وقدْ أضفى حبُّهُ للطّبيعةِ والتّأملِ نكهةً خاصةً على أسلوبِهِ وكتاباتِهِ التي ما زالتْ خالدةً حتى يومِنا هذا،',
'ويُعَدُّ كثيرٌ منها مراجعَ أدبيّةً مُهمةً.']},
{q:'متى وأين توفي ميخائيل نعيمة؟',key:0,a:[
'توفِّيَ الأديبُ ميخائيل نعيمة عامَ 1988 عَنْ عمرٍ ناهزَ مئةَ عامٍ',
'في قريةِ الشّخروبِ التي عاشَ فيها معظمَ حياتِهِ.']},
{q:'انسب الشعراء أدناه إلى مدارسهم (مدرسة المهجر - الرابطة القلمية).',key:0,a:[
'مدرسة المهجر (المهجر الشمالي) الرابطة القلمية.']}
]},

{q:'ماذا حاول الشاعر تصويره في هذه القصيدة؟',key:0,a:[
'حاولَ الشّاعرُ في هذهِ القصيدةِ أنْ يصوّرَ ما هوَ خارجُ نفسِهِ بمرآةِ نفسِهِ الصّافيةِ',
'عَبْرَ الاستبطانِ الذّاتيِّ للعالمِ الذي يقعُ حولَهُ.']},
{q:'أكثر الشاعر من صور الطبيعة... ما نوع النقد الذي يكشف عن أهمية التكرار؟',key:1,a:[
'فأكثرَ من صُوَرِ الطّبيعةِ التي تضيقُ بالشّاعرِ، غيرَ أنَّ ذاتَ الشّاعرِ هي التي تغيّرُ هذهِ الصّورةَ الواقعيّةَ المأساويّةَ بأخرى مثاليّةٍ حالمة. فما أَنْ يُغمضَ الشّاعرُ عينيهِ منتقلا إلى البصيرةِ الدّاخليّةِ ستتحوّلُ الطّبيعةُ والأشياءُ مِنْ حولِهِ وتنقلبُ مِنْ داءٍ إلى دواءٍ ومِنْ موتٍ إلى حياةٍ.',
'ويُدعَى هذا النّوعُ من التّحليلِ القائمِ على النظرِ إلى الصُّوَرِ الفنيّةِ التي يتألّفُ منها العملُ الأدبيُّ (نقدًا فنيًّا) الذي تعرفنا إليه عند دراستِنا قصيدة الشَّاعر الحبوبيّ،',
'وهو نوعٌ من النّقدِ يكشفُ عن أهمية التّكرارِ في تعزيزِ المعنى.']},
{q:'هل كان الشاعر موفقًا في تكرار صوره المتوازية؟',key:0,a:[
'فقدْ أكثرَ الشّاعرُ من تكرارِ صورِهِ المتوازيةِ التي تعبّرُ عن المعنى نفسِهِ من أجلِ أنْ يُدرِكَ القارئُ مقاصدَ الشّاعرِ ولا سيّما تكرار «أَغْمِضْ جُفُونَكَ تُبْصِرْ »،',
'فهو يرسمُ يوتوبيا أو مدينةً فاضلةً بوصفِها المثالَ الذي يطمحُ إليهِ الشّاعرُ، مقارنةً بالواقعِ المأساويِّ المحيطِ به الذي يستجيبُ لنزعتِهِ الرُّومانسيّةِ في التّعبيرِ الشعريِّ.']},
{q:'لماذا يحاول الأدباء والمفكرون رسم المدينة الفاضلة؟',key:1,a:[
'بوصفِها المثالَ الذي يطمحُ إليهِ الشّاعرُ، مقارنةً بالواقعِ المأساويِّ المحيطِ به الذي يستجيبُ لنزعتِهِ الرُّومانسيّةِ في التّعبيرِ الشعريِّ،',
'وهو ما سعى إليهِ الفلاسفةُ والأدباءُ أيضًا مِنْ قديمِ الزمانِ؛ فقد كتبَ أفلاطون جمهوريتَهُ الفاضلةَ، وكذلكَ كتبَ الفارابيّ مدينتَهُ الفاضلةَ، وتابعَهُمَا في هذا المسعى كثيرٌ من الأدباءِ والفلاسفةِ والمفكِّرينَ،',
'فهو حُلُمُ البشريّة في البحثِ عن مدينةٍ يسودُها العدلُ والرخاءُ.']}
]}
];

function highlight(text,terms){var rest=text,out='';var list=terms.slice().sort(function(a,b){return b.t.length-a.t.length;});

  for(var k=0;k<list.length;k++){var ix=rest.indexOf(list[k].t);if(ix>-1&&(!best||ix<best.ix))best={ix:ix,tm:list[k],idx:terms.indexOf(list[k])};}
  if(!best){out+=esc(rest);break;}
  out+=esc(rest.slice(0,best.ix))+'<span class="term" data-ti="'+best.idx+'">'+esc(best.tm.t)+'</span>';
  rest=rest.slice(best.ix+best.tm.t.length);}
 return out;}

function startExam(){
 var body=examVeil.querySelector('#exBody');examVeil.classList.add('show');
 var ri=0,score=0,max=0,breakdown=[];
 function rMax(r){return r.items.reduce(function(a,it){return a+(it.level||1);},0);}
 function lvBadge(l){return ['⭐ سهل','⭐⭐ متوسط','⭐⭐⭐ صعب'][(l||1)-1];}
 function finishExam(){
   var pct=Math.round(score/max*100);
   var stars=pct>=85?3:pct>=65?2:pct>=40?1:0;
   var passed=pct>=60;
   if(passed&&!META.seals['exam'])META.seals['exam']=true;
   META.stars['exam']=Math.max(META.stars['exam']||0,stars);saveMeta();
   var best=examBest(),isRec=pct>best;
   if(isRec){try{localStorage.setItem('jh_exbest',pct);}catch(e){}}
   var rows=breakdown.map(function(b){return '<div class="metarow"><span class="mn">'+b.n+'</span><span class="ms">'+arNum(b.g)+' / '+arNum(b.m)+'</span></div>';}).join('');
   body.innerHTML='<div class="qz-score"><span class="qz-kick">🎓 نتيجة الاختبار الشامل</span>'
    +'<div class="num">'+arNum(pct)+'٪</div>'
    +'<div class="eq-stars">'+'⭐'.repeat(stars)+'</div>'
    +(passed?'<div class="sealbadge">🎓 نجحت في الاختبار الشامل</div>':'<p style="color:#b3403f;font-weight:800">لم تبلغ درجة النجاح (٦٠٪) بعد — أعد المحاولة!</p>')
    +(isRec?'<div class="sealbadge">🏆 رقم قياسي جديد: '+arNum(pct)+'٪</div>':'')
    +rows+'<p>رتبتك: '+rankInfo().i+' '+rankInfo().n+'</p>'
    +'<button class="qz-next" id="exRetry">🔁 إعادة</button> <button class="qz-close" id="exClose">✕</button></div>';
   celebrate();
   body.querySelector('#exRetry').onclick=startExam;
   body.querySelector('#exClose').onclick=function(){examVeil.classList.remove('show');};
 }
 function runRound(){
   var r=EXAM.rounds[ri];
   var items=r.items.slice().sort(function(a,b){return (a.level||1)-(b.level||1);});
   var ii=0,rg=0;max+=rMax(r);
   function item(){
     var it=items[ii],lv=it.level||1,optsArr=[],correct='';
     if(r.type==='fill'){optsArr=shuffle(buildFillBank(r.items,it).map(function(w){return{t:w,ok:w===it.a};}));correct=it.a;}
     else if(r.type==='tf'){optsArr=[{t:'✔ صح',ok:it.tf===true},{t:'✘ خطأ',ok:it.tf===false}];correct=it.tf?'✔ صح':'✘ خطأ';}
     else{optsArr=shuffle(it.o.map(function(o,i){return{t:o,ok:i===it.a};}));correct=it.o[it.a];}
     var qhtml= r.type==='fill' ? '<div class="qz-q">'+esc(it.s).replace('___','<b class="blank">؟؟؟</b>')+'</div>'
              : r.type==='tf'  ? '<div class="qz-q">'+esc(it.s)+'</div>'
              : '<div class="qz-q">'+esc(it.q)+'</div>';
     body.innerHTML='<span class="qz-kick">'+r.name+'</span><div class="qz-title">السؤال '+arNum(ii+1)+' / '+arNum(items.length)+' · '+lvBadge(lv)+'</div>'
      +qhtml
      +'<div class="qz-opts">'+optsArr.map(function(o,i){return '<button class="qz-opt" data-i="'+i+'">'+esc(o.t)+'</button>';}).join('')+'</div>'
      +'<div class="qz-ex" id="exEx" style="display:none"></div>'
      +'<div class="qz-foot"><span id="exScore">النقاط: '+arNum(score)+'</span><button class="qz-next" id="exNext" style="display:none">'+(ii===items.length-1?(ri===EXAM.rounds.length-1?'النتيجة':'الجولة التالية'):'التالي')+'</button></div>';
     var locked=false;
     Array.prototype.forEach.call(body.querySelectorAll('.qz-opt'),function(b){b.onclick=function(){
        if(locked)return;locked=true;
        var ok=optsArr[+b.getAttribute('data-i')].ok;
        if(ok){b.classList.add('ok');score+=lv;rg+=lv;}
        else{b.classList.add('no');
          var ci=optsArr.findIndex(function(o){return o.ok;});
          var cb=body.querySelector('.qz-opt[data-i="'+ci+'"]');if(cb)cb.classList.add('ok');}
        var ex=body.querySelector('#exEx');ex.style.display='block';
        ex.innerHTML=ok?('✅ أحسنت! +'+arNum(lv)+' نقطة'):('💡 الصحيح: '+esc(correct)+(it.fix?' — '+esc(it.fix):''));
        body.querySelector('#exScore').textContent='النقاط: '+arNum(score);
        body.querySelector('#exNext').style.display='inline-block';
     };});
     body.querySelector('#exNext').onclick=function(){
        ii++;
        if(ii<items.length)item();
        else{breakdown.push({n:r.name,g:rg,m:rMax(r)});ri++;
          if(ri<EXAM.rounds.length)runRound();else finishExam();}
     };
   }
   item();
 }
 runRound();
}

 else if(a==='m-phone'){setMode('phone');closeEM();}

function wheelRadius(n){var f=1;if(currentMode==='phone')f=.72;if(currentMode==='present')f=1.18;return Math.min(60+n*14,130)*f;}
function updateWheels(){QS.forEach(function(o){if(!o)return;var R=wheelRadius(o.segs.length);Array.prototype.forEach.call(o.wheel.querySelectorAll('.card'),function(c){c.style.setProperty('--R',(-R)+'px');});});}
function _applyModeBase(m){currentMode=m;document.body.classList.remove('mode-phone','mode-tablet','mode-present');document.body.classList.add('mode-'+m);updateWheels();updateProgress();applyScale();}
function applyMode(m){_applyModeBase(m);}
function setMode(m){applyMode(m);try{localStorage.setItem(MODE_KEY,m);}catch(e){}}
function detectMode(){if(matchMedia('(pointer:coarse)').matches)return 'phone';return innerWidth<768?'phone':'tablet';}
var IN_FRAME=(window.top!==window.self);
var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function fsSupported(){var el=document.documentElement;return !!(el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen);}
function fsActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement);}
function lockLand(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});}catch(e){}}
function enterFS(){var el=document.documentElement;
 var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
 if(!req)return false;
 try{var p=req.call(el);
  if(p&&p.then){p.then(lockLand).catch(function(){goImmersive();});}
  else lockLand();
  return true;
 }catch(e){return false;}}
function exitFS(){var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen;
 if(ex){try{ex.call(document);}catch(e){}}}
function iosGuide(){
 try{if(localStorage.getItem('jh_iosGuide'))return;localStorage.setItem('jh_iosGuide','1');}catch(e){}
 var g=document.createElement('div');
 g.style.cssText='position:fixed;inset:0;z-index:900;background:rgba(20,8,50,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px';
 g.innerHTML='<div style="background:#fff;border-radius:18px;max-width:430px;padding:22px;font-family:Tajawal,sans-serif;text-align:center;color:#2b2118">'
 +'<div style="font-size:2.2rem">📱</div><h3 style="margin:.4rem 0;font-size:1.1rem">الملء الكامل على الآيفون</h3>'
 +'<p style="font-size:.85rem;line-height:1.9;color:#6b563f">كل متصفحات الآيفون (حتى كروم) <b>ممنوعة</b> من ملء الشاشة بقرار من آبل.<br><b>الحل الوحيد لملء حقيقي:</b><br>١) افتح التطبيق من رابط خارجي (ليس Apps Script)<br>٢) مشاركة <b>⤴</b> ← <b>إضافة إلى الشاشة الرئيسية</b><br>٣) افتحه من الأيقونة → ملء كامل بلا أشرطة.</p>'
 +'<button id="iosGuideOk" style="margin-top:.6rem;background:linear-gradient(120deg,#e6c25a,#c9a227);border:none;color:#3a2a10;font-family:Tajawal,sans-serif;font-weight:800;padding:.6rem 1.6rem;border-radius:12px;cursor:pointer">فهمت ✨</button></div>';
 document.body.appendChild(g);
 g.querySelector('#iosGuideOk').onclick=function(){g.remove();};
}
function goImmersive(){document.body.classList.add('immersive');
 setTimeout(function(){window.scrollTo(0,1);},120);
 toast(isIOS||IN_FRAME?'✨ وضع الملء الذكي مفعّل\nسفاري الآيفون لا يدعم ملء الشاشة الويبّي':'✨ وضع الملء الذكي مفعّل');
 if(isIOS)iosGuide();}
function stopImmersive(){document.body.classList.remove('immersive');}
function toggleFS(){
 if(fsActive()){exitFS();stopImmersive();return;}
 if(document.body.classList.contains('immersive')){stopImmersive();return;}
 if(!isIOS&&!IN_FRAME&&fsSupported()){
  if(enterFS())return;
 }
 goImmersive();
}
addEventListener('resize',function(){updateWheels();applyScale();var s=null;try{s=localStorage.getItem(MODE_KEY);}catch(e){}if(!s)applyMode(detectMode());});
function rotateWheel(g,inst){var o=QS[g],w=o.wheel;if(!o||o.selP<0)return;if(inst){w.style.transition='none';Array.prototype.forEach.call(w.querySelectorAll('.card-in'),function(c){c.style.transition='none';});}w.style.setProperty('--rot',(-o.selP*o.step)+'deg');Array.prototype.forEach.call(w.querySelectorAll('.card-in'),function(c,i){c.classList.toggle('sel',i===o.selP);});if(inst){void w.offsetWidth;w.style.transition='';Array.prototype.forEach.call(w.querySelectorAll('.card-in'),function(c){c.style.transition='';});}o.pointer.classList.remove('bounce');void o.pointer.offsetWidth;o.pointer.classList.add('bounce');}
