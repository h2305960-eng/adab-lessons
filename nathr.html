<title>النثر · القصة القصيرة</title>

<script>
window.addEventListener('error',function(e){
 if(!document.body)return;
 var d=document.getElementById('errBox');
 if(!d){d=document.createElement('div');d.id='errBox';
  d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#fff;color:#a00;padding:12px;font-family:monospace;white-space:pre-wrap;max-height:40%;overflow:auto;direction:ltr;border-top:2px solid #a00';
  document.body.appendChild(d);}
 d.textContent+='⚠ '+e.message+' (line '+e.lineno+')\n';
});
</script>
<style>
/* ═══ 1) المتغيرات · باليتة الليل الملكي والشمبانيا ═══ */
:root{
 --bg1:#F8F6F0;--bg2:#EDE7DA;--bg3:#D6CDB8;--bg4:#D6CDB8;
 --ink:#10243E;--ink2:#2C4160;--ink3:#52658A;
 --gold:#1E4E8C;--gold2:#14366B;--goldS:#5B8FD4;
 --violet:#C8A24A;--violet2:#A88432;
 --card:rgba(248,246,240,.62);--card2:rgba(248,246,240,.86);--card3:rgba(248,246,240,.96);
 --tP1:rgba(30,78,140,.10);--tP2:rgba(30,78,140,.24);--tP3:rgba(30,78,140,.45);
 --tV1:rgba(200,162,74,.16);--tV2:rgba(200,162,74,.38);
 --gbg:rgba(248,246,240,.58);--gbd:rgba(30,78,140,.28);--gbd2:rgba(248,246,240,.92);
 --gsh:0 2px 6px rgba(16,36,62,.06),0 16px 40px rgba(16,36,62,.14);
 --r-s:10px;--r-m:14px;--r-l:20px;--k:1}
html[data-theme="dark"]{
 --bg1:#0A1526;--bg2:#12233C;--bg3:#1B3355;--bg4:#1B3355;
 --ink:#F4F1E8;--ink2:#DCE4F0;--ink3:#A9B8CE;
 --gold:#7FB0E8;--gold2:#DCE8F7;--goldS:#1E4E8C;
 --violet:#E8C877;--violet2:#C8A24A;
 --card:rgba(18,35,60,.62);--card2:rgba(18,35,60,.86);--card3:rgba(18,35,60,.96);
 --tP1:rgba(127,176,232,.12);--tP2:rgba(127,176,232,.26);--tP3:rgba(127,176,232,.48);
 --tV1:rgba(232,200,119,.14);--tV2:rgba(232,200,119,.36);
 --gbg:rgba(18,35,60,.58);--gbd:rgba(127,176,232,.28);--gbd2:rgba(244,241,232,.14);
 --gsh:0 2px 6px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.45)}
/* ═══ 2) الأساس ═══ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::selection{background:var(--violet);color:#fff}
html,body{height:100%;overflow:hidden;touch-action:pan-y}
body{font-family:'Tajawal',sans-serif;color:var(--ink);line-height:1.8;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
background:
 radial-gradient(1200px 500px at 85% -10%,var(--tV1),transparent 60%),
 radial-gradient(900px 420px at 10% 110%,var(--tP1),transparent 60%),
 linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 42%,var(--bg3) 82%,var(--bg4) 100%);
background-attachment:fixed}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
.layers::-webkit-scrollbar,.hs-body::-webkit-scrollbar,.muwashah::-webkit-scrollbar,.shawahid::-webkit-scrollbar,.gate::-webkit-scrollbar,.np-list::-webkit-scrollbar,.dlist::-webkit-scrollbar,.edgeMenu::-webkit-scrollbar,.quiz-card::-webkit-scrollbar,.jz-card::-webkit-scrollbar{width:6px;height:6px}
.layers::-webkit-scrollbar-thumb,.hs-body::-webkit-scrollbar-thumb,.muwashah::-webkit-scrollbar-thumb,.shawahid::-webkit-scrollbar-thumb,.gate::-webkit-scrollbar-thumb,.np-list::-webkit-scrollbar-thumb,.dlist::-webkit-scrollbar-thumb,.edgeMenu::-webkit-scrollbar-thumb,.quiz-card::-webkit-scrollbar-thumb,.jz-card::-webkit-scrollbar-thumb{background:var(--tP2);border-radius:3px}
.glass,.fab,.edgeMenu,.rail .track,.zoomframe,.zoomclose,.tip,.drawer,.wcap,.quiz-veil,.jz-veil,.navPanel{-webkit-backdrop-filter:blur(14px) saturate(125%);backdrop-filter:blur(14px) saturate(125%)}
/* ═══ 3) الخلفية الحيّة ═══ */
.sun{position:fixed;top:-140px;left:-80px;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,var(--tV2),var(--tV1) 45%,transparent 70%);filter:blur(22px);-webkit-filter:blur(22px)}
.cloud{position:fixed;pointer-events:none;z-index:1;filter:blur(34px);-webkit-filter:blur(34px);background:radial-gradient(closest-side,var(--card2),transparent 72%);animation:drift linear infinite}
@keyframes drift{0%{transform:translateX(-30vw)}100%{transform:translateX(125vw)}}
.letters{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;pointer-events:none;z-index:1}
.lt{position:absolute;font-weight:800;color:var(--tP3);background:var(--card);border:1px solid var(--gbd2);border-radius:var(--r-m);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;animation:fl linear infinite}
@keyframes fl{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-20vh) rotate(320deg)}}
/* ═══ 4) الزجاج والزخارف ═══ */
.glass{background:var(--gbg);border:1px solid var(--gbd);border-radius:var(--r-l);position:relative;overflow:hidden;box-shadow:var(--gsh),inset 0 1px var(--gbd2)}
.glass::before{content:'';position:absolute;top:-45%;right:-25%;width:65%;height:90%;background:radial-gradient(ellipse,var(--card2),transparent 68%);pointer-events:none}
.orn-c::after{content:'';position:absolute;top:7px;right:7px;bottom:7px;left:7px;border:1px solid var(--tP2);border-radius:var(--r-m);pointer-events:none}
.orn-c .corner{position:absolute;width:16px;height:16px;color:var(--violet);font-size:11px;line-height:16px;text-align:center;z-index:3;pointer-events:none}
.corner.tl{top:2px;right:2px}.corner.tr{top:2px;left:2px}.corner.bl{bottom:2px;right:2px}.corner.br{bottom:2px;left:2px}
.seal{position:fixed;bottom:10px;left:22px;right:auto;top:auto;z-index:70;width:56px;height:56px;border-radius:50%;border:3px double var(--gold);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;transform:rotate(-10deg);color:var(--gold);background:var(--card2);box-shadow:var(--gsh);animation:stamp .8s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none}
.seal .s1,.seal .s3{display:none}
.seal .s2{font-size:.5rem;font-weight:800;line-height:1.3;text-align:center}
@keyframes stamp{0%{opacity:0;transform:rotate(-35deg) scale(1.7)}100%{opacity:1;transform:rotate(-10deg) scale(1)}}
.watermark{position:fixed;top:10px;left:58px;z-index:1;pointer-events:none;font-weight:900;font-size:clamp(1.7rem,4vw,2.9rem);color:var(--tP2);transform:rotate(-3deg)}
/* ═══ 5) القائمة الحافّة والقائمة الجانبية ═══ */
.fab{position:fixed;top:10px;right:10px;z-index:145;width:46px;height:46px;border-radius:var(--r-m);border:1px solid var(--gbd);background:var(--card2);font-size:1.25rem;cursor:pointer;box-shadow:var(--gsh);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;transition:.25s}
.fab.open{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff}
.edgeMenu{position:fixed;top:0;bottom:0;right:0;width:min(230px,74vw);z-index:140;border-left:1px solid var(--gbd2);box-shadow:-14px 0 40px var(--tP1);transform:translateX(105%);transition:transform .4s cubic-bezier(.3,1.1,.35,1);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;padding:.7rem .6rem;overflow-y:auto;background:var(--card3)}
.edgeMenu.show{transform:translateX(0)}
.em-item{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--gbd);border-radius:var(--r-s);padding:.5rem .7rem;margin-bottom:.35rem;cursor:pointer;font-family:'Tajawal';font-weight:700;font-size:.8rem;color:var(--ink2);transition:.2s;text-align:right}
.em-item .ic{font-size:1rem;-webkit-flex:0 0 auto;flex:0 0 auto}
.em-item:hover{border-color:var(--violet);color:var(--ink);transform:translateX(-2px)}
.em-sep{height:1px;background:linear-gradient(90deg,var(--tP2),transparent);margin:.3rem 0}
/* ═══ 6) سكة التقدم ═══ */
.rail{position:fixed;left:0;top:0;bottom:0;transform:none;z-index:70;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;width:16px;padding:.4rem 0;pointer-events:none}
.rail .pct{writing-mode:vertical-rl;font-size:.55rem;font-weight:800;color:var(--gold);padding:.2rem 0}
.rail .track{position:relative;width:6px;-webkit-flex:1;flex:1;height:auto;border-radius:3px;background:var(--card);border:1px solid var(--gbd)}
.rail .fill{position:absolute;bottom:0;left:0;right:0;height:0%;border-radius:3px;background:linear-gradient(0deg,var(--gold2),var(--gold) 55%,var(--violet));transition:height .8s}
.rail .orb{position:absolute;left:50%;transform:translate(-50%,50%);bottom:0%;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--violet) 55%,var(--violet2));box-shadow:0 0 0 3px var(--tV1);transition:bottom .8s}
.rail .rlabel{writing-mode:vertical-rl;font-size:.5rem;font-weight:800;color:var(--gold);letter-spacing:1px;opacity:.8}
/* ═══ 7) الشرائح ═══ */
.qinner,.hubsum,.muwashah,.shawahid,.gate,.cover,.sintro,.end{zoom:var(--k,1)}
.deck{position:fixed;top:0;right:0;bottom:0;left:0;z-index:5;display:-webkit-flex;display:flex;touch-action:pan-y;transform:translateX(calc(var(--idx,0)*100% + var(--drag,0px)))}
.deck.anim{transition:transform .75s cubic-bezier(.3,1.25,.35,1)}
.slide{-webkit-flex:0 0 100%;flex:0 0 100%;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:74px 46px 46px 60px;transform:scale(.93);opacity:.4;transition:transform .75s,opacity .75s}
.slide.act{transform:scale(1);opacity:1}
.cover,.end,.sintro{text-align:center;max-width:680px;padding:2.2rem 2.6rem}
.kick{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.5px;color:var(--gold);background:var(--tV1);border:1px solid var(--tV2);border-radius:16px;padding:.28rem 1rem;margin-bottom:.9rem}
.cover h1,.sintro h1{font-weight:900;font-size:clamp(1.9rem,4.6vw,3rem);line-height:1.65;
 background:linear-gradient(120deg,var(--gold) 20%,var(--violet) 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold)}
.orn{color:var(--violet);opacity:.9;margin:.6rem 0;letter-spacing:2px;font-size:.8rem}
.cover p,.sintro p{color:var(--ink2);font-size:.92rem;font-weight:500;max-width:500px;margin:0 auto .9rem}
.stats{display:-webkit-flex;display:flex;gap:.55rem;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:1.1rem}
.stats span{background:var(--card);border:1px solid var(--gbd);border-radius:var(--r-m);padding:.35rem .9rem;font-size:.78rem;font-weight:700}
.stats b{color:var(--gold)}
.swipe-hint{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;gap:.9rem;color:var(--ink2);font-weight:800;font-size:.85rem;margin-top:.6rem}
.sw-arrow{color:var(--violet);font-weight:900;font-size:1.5rem;display:inline-block;animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(-22px)}}
.sintro .sicon{font-size:2.6rem;display:block;margin-bottom:.4rem}
.end .big-pct{font-weight:900;font-size:clamp(2.6rem,6vw,4rem);color:var(--gold)}
.ebar{width:min(320px,80%);height:12px;border-radius:20px;background:var(--card);border:1px solid var(--gbd);margin:.8rem auto;overflow:hidden}
.ebar i{display:block;height:100%;width:0%;border-radius:20px;background:linear-gradient(90deg,var(--gold),var(--violet));transition:width 1s}
.ebtn{border:none;cursor:pointer;font-family:'Tajawal';font-weight:800;color:#fff;font-size:.85rem;padding:.6rem 1.7rem;border-radius:30px;margin-top:.8rem;background:linear-gradient(120deg,var(--gold),var(--gold2));box-shadow:var(--gsh)}
/* ═══ 8) بطاقة السؤال والعجلة ═══ */
.qinner{display:grid;grid-template-columns:1.15fr .85fr;gap:1.1rem;width:min(1200px,100%);height:min(82vh,760px);-webkit-align-items:stretch;align-items:stretch}
.layers{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:.55rem;overflow-y:auto;padding-left:3px;touch-action:pan-y}
.layer{padding:.95rem 1.15rem;-webkit-flex:none;flex:none}
.ltag{display:-webkit-inline-flex;display:inline-flex;font-size:.62rem;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--gold),var(--gold2));border-radius:var(--r-s);padding:.15rem .7rem;margin-bottom:.5rem}
.qtext{font-weight:800;font-size:clamp(1.02rem,1.85vw,1.3rem);line-height:1.9}
.varbtn{margin-top:.5rem;border:1px dashed var(--tP3);background:var(--tV1);color:var(--gold);border-radius:var(--r-s);padding:.32rem .85rem;font-size:.7rem;font-weight:800;cursor:pointer;font-family:'Tajawal'}
.varbox{max-height:0;overflow:hidden;transition:max-height .55s}
.varbox.open{max-height:230px}
.var{display:-webkit-flex;display:flex;gap:.45rem;background:var(--card);border:1px solid var(--tP2);border-radius:var(--r-s);padding:.35rem .7rem;margin-top:.4rem;font-size:.74rem;color:var(--ink2);opacity:0;transition:.4s}
.varbox.open .var{opacity:1}
.var i{font-style:normal;color:var(--violet2)}
.hint{font-size:.6rem;font-weight:700;color:var(--ink2);margin-bottom:.45rem;display:-webkit-flex;display:flex;gap:.4rem;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.legend{display:-webkit-inline-flex;display:inline-flex;-webkit-align-items:center;align-items:center;gap:.3rem}
.dot-g{width:9px;height:9px;border-radius:3px;background:linear-gradient(transparent 55%,var(--tP3) 55%)}
.dot-t{width:9px;height:9px;border-radius:50%;background:var(--violet)}
.answer{font-weight:500;font-size:clamp(.98rem,1.6vw,1.18rem);line-height:2.45;text-align:justify;max-width:62ch}
.seg{cursor:pointer;border-radius:8px;padding:.02em .16em;transition:.28s;background:linear-gradient(transparent 62%,var(--tP2) 62%)}
.seg.act{background:var(--card3);box-shadow:0 0 0 2px var(--tP3)}
.seg.seen:not(.act){background:linear-gradient(transparent 62%,var(--tP3) 62%)}
.seg.pull{font-weight:800;font-size:1.06em;padding-left:.5rem;border-left:3px solid var(--violet)}
.term{color:#fff;background:linear-gradient(120deg,var(--violet),var(--violet2));border-radius:8px;padding:.02em .4em;font-weight:800;cursor:pointer}
.layers .divsep{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:.6rem;color:var(--violet);opacity:.9}
.layers .divsep::before,.layers .divsep::after{content:'';-webkit-flex:1;flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--tV2),transparent)}
.visual{position:relative;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.wheelstage{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;gap:.4rem}
.pointer{font-size:1.35rem;color:var(--violet);z-index:6;line-height:1}
.pointer.bounce{animation:bnc .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes bnc{0%{transform:translateY(-12px)}60%{transform:translateY(4px)}100%{transform:translateY(0)}}
.wheelwrap{position:relative;width:min(350px,44vh);height:min(350px,44vh)}
.ring{position:absolute;top:6%;right:6%;bottom:6%;left:6%;border-radius:50%;border:2px dashed var(--tV2);animation:spin 44s linear infinite}
.ring2{position:absolute;top:14%;right:14%;bottom:14%;left:14%;border-radius:50%;border:1px solid var(--tP2)}
@keyframes spin{to{transform:rotate(360deg)}}
.wheel{position:absolute;top:0;right:0;bottom:0;left:0;--rot:0deg;transform:rotate(var(--rot));transition:transform 1s cubic-bezier(.34,1.2,.4,1)}
.card{position:absolute;left:50%;top:50%;width:104px;height:78px;margin:-39px -52px;transform:rotate(var(--a)) translateY(var(--R,-120px))}
.card-in{width:100%;height:100%;border-radius:var(--r-s);overflow:hidden;cursor:pointer;position:relative;transform:rotate(calc(-1*(var(--a) + var(--rot))));transition:transform 1s;border:3px solid var(--gbd2);box-shadow:var(--gsh);background:transparent}
.card-in img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.card-in .cn{position:absolute;bottom:3px;right:4px;font-size:.55rem;font-weight:900;color:#fff;background:var(--tP3);border-radius:6px;padding:0 .35rem}
.card-in.sel{border-color:var(--violet);box-shadow:0 0 0 4px var(--tV2)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:82px;height:82px;border-radius:50%;background:var(--card2);border:1px solid var(--gbd2);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;z-index:4}
.hub b{font-size:1.3rem;font-weight:900;color:var(--gold);line-height:1}.hub span{font-size:.53rem;font-weight:800;color:var(--gold)}
.wcap{font-size:.7rem;font-weight:700;background:var(--card2);border:1px solid var(--gbd);border-radius:var(--r-s);padding:.2rem .9rem}
.wcap b{color:var(--gold)}
.zoomframe{position:absolute;top:0;right:0;bottom:0;left:0;z-index:8;border-radius:var(--r-m);overflow:hidden;cursor:pointer;border:1px solid var(--gbd2);background:transparent;opacity:0;pointer-events:none;transform:scale(.85);transition:opacity .45s,transform .5s cubic-bezier(.25,1.3,.4,1)}
.zoomframe.show{opacity:1;pointer-events:auto;transform:scale(1)}
.zoomimg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
.zoomcap{position:absolute;bottom:0;left:0;right:0;padding:.6rem .85rem;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;gap:.6rem;background:linear-gradient(transparent,rgba(16,36,62,.88))}
.zoomtxt{color:#fff;font-size:.78rem;font-weight:600;-webkit-flex:1;flex:1;line-height:1.55}
.zoombadge{color:#fff;background:linear-gradient(135deg,var(--violet),var(--violet2));font-size:.6rem;font-weight:900;border-radius:9px;padding:.18rem .6rem;white-space:nowrap}
.zoomclose{position:absolute;top:10px;left:10px;color:#fff;background:var(--tP3);font-size:.62rem;font-weight:800;border-radius:var(--r-s);padding:.25rem .6rem}
/* ═══ 9) لوحة التنقل والدرج والتلميح ═══ */
.navPanel{position:fixed;top:0;bottom:0;right:0;width:min(300px,86vw);z-index:130;background:var(--card3);border-left:1px solid var(--gbd2);box-shadow:-14px 0 40px var(--tP1);transform:translateX(105%);transition:transform .45s cubic-bezier(.3,1.1,.35,1);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;padding:.8rem}
.navPanel.open{transform:translateX(0)}
.np-head{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;margin-bottom:.5rem}
.np-head h3{font-size:.95rem;font-weight:900}
.dclose{width:32px;height:32px;border-radius:50%;border:1px solid var(--gbd);background:var(--card);font-weight:900;cursor:pointer}

{q:'عرّف النثر الفني، وبيّن أوجه الشبه والاختلاف بينه وبين النثر غير الفني.',key:0,a:['هو النوع الثاني من الأدب، ويسمى بالنثر الفني،','وهو يختلف عن النثر الاعتيادي (غير الفني) الذي يستعمله الناس كل يوم في كلامهم أو في المقالات الصحفية التي تعتمد الأخبار بأنواعها المختلفة، أو في الكتب المدرسية أو العلمية أو غيرها مما لا يتطلب أسلوبًا مؤثرًا.']},
{q:'ما الفنون التي يضمها النثر الفني؟',key:0,a:['ويضم النثر الفني فنونًا متنوعة مثل القصة والرواية والمقالة والخطابة والسيرة وغيرها.']},
{q:'عرّف النثر الفني (ما هو النثر الفني)؟',key:1,a:['ويُعرَّف بأنه الكلام الفني الجميل الذي ينتقي فيه الكاتب الألفاظ الجيدة والواضحة والأسلوب المؤثر لتقديم فكرته أو موضوعه.']},
{q:'ما الفرق بين النثر بنوعيه (الفني وغير الفني) والشعر؟',key:0,a:['والنثر - بنوعيه الفني وغير الفني - خلافًا للشعر ليس له أوزان أو قوافٍ.']},
{q:'ما أنواع النثر التي عرفها العرب قديمًا؟',key:0,a:['الرسائل والوصايا والأمثال والخطابة والمقامة، وهي من الفنون النثرية التي عرفها العرب قديمًا.']},
{q:'ما فنون النثر الحديثة التي دخلت إلى الأدب العربي عبر الترجمة؟',key:1,a:['القصة والرواية والمسرحية والمقالة، وهي من فنون النثر الحديثة التي دخلت إلى الأدب العربي عبر الترجمة.']},
{q:'ما أنواع النثر الفني التي انحسرت عن الساحة الأدبية؟',key:0,a:['بعض أنواع النثر الفني انحسرت عن الساحة الأدبية اليوم كالمقامة والوصايا والأمثال،','وكذلك الخطابة التي باتت مقتصرة على جوانب حياتية محددة كالخطب الدينية.']},
{q:'ما هي الخطابة (عرّف الخطابة)؟ وما هي أهميتها؟',key:0,a:['والخطابة لون من ألوان الفنون النثرية المهمة التي عرفها العرب منذ القدم، كما عرفتها الأمم الأخرى؛','لما لها من أهمية في التأثير في الجماهير لشحذ هممهم، أو تشجيعهم على خوض غمار المعارك بغية رد الأعداء المتربصين، والدفاع عن النفس والوطن، ولا تكون الخطابة إلا بحضور الجمهور.']},
{q:'ما هي شروط الخطيب؟',key:1,a:['ويشترط أن تتوافر في الخطيب مزايا عدة، منها سلامة مخارج الأصوات ووضوحها، والصوت الجهوري القوي،','فضلاً عن الثقافة والمعرفة التي ينبغي للخطيب أن يمتلكها عن الموضوع الذي يتحدث عنه.']},
{q:'أتعد الخطابة موهبة فطرية أم شيئًا مكتسبًا؟',key:0,a:['وعلى الرغم من كل هذه الشروط، تبقى الخطابة موهبة فطرية تولد مع الخطيب وتنميها المواقف والبيئة.']},
{q:'علل: تطور فن الخطابة بعد مجيء الإسلام.',key:0,a:['وقد تطور هذا الفن بعد مجيء الإسلام؛ لأهميته في نشر الدعوة الإسلامية، وبيان الأحكام الدينية والاجتماعية،','وازادت أهميته في العصور التالية؛ إذ أخذ أتباع الدول الجديدة بالدعوة لها عبر الخطب.']},
{q:'كيف تطورت (نهضت) الخطابة في العصر الحديث؟ ومن هم أبرز الخطباء الذين ظهروا؟',key:1,a:['أما في العصر الحديث فقد نهض هذا الفن بنهوض الأمة في أواخر القرن التاسع عشر ومطلع القرن العشرين، ولاسيما بعد قيام الثورات ضد المحتلين،','فبرز عدد من الخطباء الذين كان لهم تأثير في الساحة العربية، مثل أحمد عرابي وسعد زغلول في مصر، وفي العراق محمد رضا الشبيبي والشيخ محمد الحسين كاشف الغطاء الذي جُمعت خطبه عن القضية الفلسطينية في كتاب بعنوان (قضية فلسطين الكبرى في خطب الإمام الراحل محمد الحسين كاشف الغطاء).']},
{q:'ما دور ثورة العشرين في العراق في الخطابة؟',key:0,a:['ولا ننسى أن ثورة العشرين في العراق أفرزت عددًا كبيرًا من الخطباء الذين كانوا يقودون الجماهير لمقاومة المحتل البريطاني.']},
{q:'متى انحسرت الخطابة وعلامَ اقتصرت؟',key:0,a:['غير أن هذا الفن بدأ بالانحسار في نهايات القرن العشرين ومطلع القرن الحادي والعشرين حتى كاد يقتصر على الخطب الدينية كخطبة الجمعة والجماعة وخطب صلاة العيدين.']},
{q:'ما الفنون الأدبية التي أخذت بالانتشار في العصر الحديث بعد انحسار الخطابة؟',key:1,a:['وإذا كانت الخطابة مثل كثير من الفنون النثرية التي أخذت بالانحسار في الأوساط الأدبية،','فإن ثمّة فنونًا أخرى أخذت بالانتشار في الأوساط الأدبية كالسيرة بنوعيها الذاتية والموضوعية.']},
{q:'ما الفرق بين النثر الفني والنثر الاعتيادي (غير الفني)؟',key:0,a:['إجابة السؤال الأول (س1).']}
]},
{name:'القصة القصيرة · النشأة والتطور',icon:'📖',wm:'القصة',theme:'story',terms:[
{t:'القصة القصيرة',d:'تعبير عن مجموعة من الأحداث قد تتناول شخصية معينة أو أكثر، ترتبط بعلاقات وأحداث يقوم الراوي بترتيبها في مدة زمنية قصيرة بصورة مشوقة.'},
{t:'الرواية',d:'أطول من القصة القصيرة، تتناول أحداثًا وبيئات وشخوصًا متعددة.'},
{t:'موباسان',d:'كاتب فرنسي من أهم كتاب القصة القصيرة في القرن التاسع عشر.'},
{t:'تشخوف',d:'كاتب روسي من أهم كتاب القصة القصيرة.'},
{t:'إدجار آلن بو',d:'كاتب أمريكي من أهم كتاب القصة القصيرة.'}],qs:[
{q:'ما تعريف القصة؟',key:0,a:['القصة بوجه عام حكاية، والحكاية هي أن يروي إنسان لآخرين ما رأى أو سمع أو تصوَّر،','وهي على هذا قديمة بقدم المجتمع الإنساني.']},
{q:'علل: تُعد القصة قديمة بقدم المجتمع الإنساني. ما الأطوار والتجارب التي مرت بها القصة؟',key:0,a:['لأنها طبيعية في الحياة، تلبّي حاجة في نفس الراوي ونفوس السامعين. وقد مرت بأطوار وتجارب وبقيت طويلاً قريبة من هذا المعنى عند عامة الشعوب.']},
{q:'ما هي القصة القصيرة بمفهومها الحديث؟ وعمَّ تعبر؟ وما الأساليب التي يستعملها فيها الكاتب؟',key:1,a:['وبعد تلك الأطوار التي مرت بها والتجارب والاهتمام أصبحنا أمام لون آخر من ألوانها تمثّل بالقصة القصيرة بمفهومها الحديث، إذ أصبحت تعبيرًا عن مجموعة من الأحداث قد تتناول شخصية معينة أو أكثر، ترتبط بعلاقات وأحداث يقوم الراوي بترتيبها في مدة زمنية قصيرة بصورة مشوقة،','وقد يستعمل الكاتب أساليب الحوار والسرد فيها.']},
{q:'ما الفرق بين القصة القصيرة والرواية؟',key:0,a:['القصة القصيرة أقصر من الرواية، وبسبب قصرها لا تتناول إلا جزءًا محدودًا من حادثة معينة أو شخصية أو غيرها من الجزئيات، فكرتها بسيطة، وحدثها واحد محدد يتناول جانبًا من الحياة، فليس من شأنها تنمية أحداث وبيئات وشخوص، كما هي الحال في الرواية،','وإنما توجز في لحظة واحدة حدثًا ذا معنى ينشأ من موقف معين عميق الدلالة والإيحاء.']},
{q:'متى ظهرت القصة القصيرة؟',key:0,a:['ظهرت القصة القصيرة في القرن التاسع عشر.']},
{q:'من هم أهم كتّاب القصة القصيرة؟',key:0,a:['ومن أهم كتابها (موباسان) في فرنسا و(تشخوف) في روسيا و(إدجار آلن بو) في أمريكا.']},
{q:'كيف تأثر العرب بالقصة القصيرة من الأدب الغربي؟',key:1,a:['وقد اطّلع العرب في هذا القرن على الأدب الغربي، فألهمهم هذا اللون من القصة الحديثة، ورأوا المكانة الشامخة التي تحتلّها، وألمّوا بالصفات التي تميّزها وتأثّروا بها فكتبوها.']},
{q:'هل تجد أصولًا للقصة القصيرة في التراث العربي؟',key:0,a:['ولا يستبعد أن نجد أصول القصة القصيرة في التراث العربي، بل يمكن أن تُعدّ السير والمقامات والحكايات والأساطير والنوادر من أصولها،','ولكن القصة القصيرة بمفهومها الحديث نشأت في الغرب.']},
{q:'على يد من من الكتّاب شهدت القصة القصيرة مرحلة متقدمة (تطورت)؟',key:0,a:['شهدت القصة القصيرة مرحلة متقدمة على يد الكاتب المصري (محمود تيمور) (1894م - 1973م) والكاتب العراقي (محمود أحمد السيد) (1903م - 1937م).']},
{q:'ماذا حاول محمود تيمور ليجعل قصصه صورة حية للحياة؟ وكيف كان أسلوبه؟',key:1,a:['فقد كان محمود تيمور على صلة قوية ومباشرة بالثقافة الأوروبية منذ وقت مبكر، نشر قصصه القصيرة في صحيفة (السفور) وهي قصص عدة في موضوعات مختلفة، كل واحدة قائمة بنفسها، حاول فيها أن يتعايش مع الطبقات الشعبية، يدرس أفكارها ورغباتها، ويتعرّف من قرب إلى نقائصها ومعائبها ليجعل من قصصه صورة صادقة للحياة حيّة مقنعة،','فجاءت فتحًا جديدًا، وحلّلت بإسهاب نفسيات الطبقة الدنيا من المصريين وأخلاقهم، وأبانت أشياء كانت خفية بأسلوب شائق ولغة مبسطة، فتقدّمت على يديه القصة القصيرة خطوات واسعة.']},
{q:'من هم كتّاب الطبقة الأولى الذين احتلوا المنزلة العالية ورفعوا الفن القصصي؟',key:0,a:['كان محمود تيمور وتوفيق الحكيم وعميد الأدب العربي طه حسين من الطبقة الأولى من أدباء مصر الذين احتلوا المنزلة العالية ورفعوا الفن القصصي.']},
{q:'ما هي الأقلام التي لمعت بعد كتّاب الطبقة الأولى في الفن القصصي؟',key:0,a:['ثم لمعت أقلام جديدة في مصر منها: إحسان عبد القدوس، ويوسف إدريس.']},
{q:'من كان رائد القصة القصيرة في العراق؟ وبم تأثر؟ وعمَّ عبّر؟',key:1,a:['وفي العراق كان رائد القصة (محمود أحمد السيد)؛ إذ كان متأثرًا أشد التأثر بما حاق بالبلاد من أخطار عبّر عنها تعبيرًا واضحًا في قصصه، مثل: (في ساعة من الزمن) و(جلال خالد) و(النكبات) و(مجاهدون).']},
{q:'من هم كتّاب القصة العراقيين الذين تبعوا (محمود أحمد السيد)؟',key:0,a:['وتبعه آخرون، مثل: سافرة جميل وجعفر الخليلي وذو النون أيوب. بعد ذلك ظهر عبد المجيد لطفي وأنور شاؤول وشاكر خصباك وعبد الملك نوري، وفؤاد التكرلي، وعبد الحق فاضل، ومهدي عيسى الصقر، ومحمود عبد الوهاب، ومحمد خضير، ومحمود جنداري، وجليل القيسي وموسى كريدي وديزي الأمير ولطيفة الدليمي وميسلون هادي ومي مظفر وغيرهم كثير.']},
{q:'من هم أشهر كتّاب القصة في بلاد الشام؟',key:0,a:['وفي بلاد الشام اشتهر بها عدد من الكتاب، في لبنان: ميخائيل نعيمة ومارون عبود، وفي سوريا: الدكتور عبد السلام العجيلي، وزكريا تامر، وأما في فلسطين فمن أبرزهم غسّان كنفاني وعلي زين العابدين.']},
{q:'من هم أشهر كتّاب القصة في المغرب العربي؟',key:0,a:['وفي المغرب العربي ظهر محمد زفزاف وعبد الجبار السحيمي والطاهر وطار.']},
{q:'من هو أشهر كتّاب القصة في السودان؟',key:0,a:['وفي السودان الطيب صالح.']}
]}
];

  if(!best){out+=esc(rest);break;}
  out+=esc(rest.slice(0,best.ix))+'<span class="term" data-ti="'+best.idx+'">'+esc(best.tm.t)+'</span>';
  rest=rest.slice(best.ix+best.tm.t.length);}
 return out;}

function perfLevel(){if(PERF.tgates===0)return 'normal';

 if(avg>=2)return 'easy';
 return 'normal';}
var MODS={

function pickMod(level){if(level==='hard'){var ks=['time','fog','spin'];return ks[PERF.tgates%3];}
 if(level==='normal'){return (PERF.tgates%2===0)?'spin':null;}
 return null;}
var gateTimerInt=null,gateMod=null,gateTimeLeft=0;
function stopGateTimer(){if(gateTimerInt){clearInterval(gateTimerInt);gateTimerInt=null;}}
function gateContent(G,mech,count){
 var o={};
 if(mech==='match')o.arr=G.match.pairs.slice(0,count);
 else if(mech==='fill')o.arr=G.fill.slice(0,count);
 else if(mech==='tf')o.arr=G.tf.slice(0,count);
 else if(mech==='timeline')o.arr=G.timeline.slice(0,count);
 else if(mech==='memory')o.arr=G.memory.pairs.slice(0,count);
 else if(mech==='sjig')o.arr=G.sjig.parts.slice(0,count);
 else if(mech==='court')o.obj={para:G.court.para,errors:G.court.errors};
 else if(mech==='scale')o.obj={sides:G.scale.sides,items:G.scale.items.slice(0,count)};

function applyMod(box,mod){
 if(!mod)return;
 if(mod==='fog'){box.classList.add('mod-fog');
  box.addEventListener('pointerover',function(e){var t=(e.target&&e.target.closest)?e.target.closest('.pz-chip,.tfrow,.fsent,.tlcard,.sjpiece,.scard,.memcard,.suspect,.plate,.sjslot,.tlslot'):null;if(t)t.classList.add('rev');},true);}
 if(mod==='spin'){box.classList.add('mod-spin');}
 if(mod==='time'){gateTimeLeft=90;var el=box.querySelector('#gateTimer');
  stopGateTimer();
  gateTimerInt=setInterval(function(){gateTimeLeft--;if(el)el.textContent='⏱ '+gateTimeLeft;
   if(gateTimeLeft<=0){stopGateTimer();toast('⏱ انتهى الوقت! لا مكافأة هذه المرة.');}},1000);}}

  var eb=area.querySelector('[data-eq]');if(eb)eb.onclick=function(){endQuiz(si);};return;}

 var C=gateContent(G,mech,count);
 var title= mech==='timeline'?'🧭 المفتاح: رتّب المحطات على الخط الزمني':
  mech==='fill'?'🗝 المفتاح: كلمة السر من الأبيات':

  solved[si]=true;

  PERF.tgates++;PERF.tmist+=gateMist.mist;PERF.streak=(gateMist.mist===0)?PERF.streak+1:0;savePerf();
  try{localStorage.setItem('nt_puzzles',JSON.stringify(solved.map(function(v,i){return v?i:-1;}).filter(function(i){return i>=0;})));}catch(e){}
  celebrate();refreshLocks();
  setTimeout(function(){area.innerHTML='<div class="pz-success"><div class="big">🏆</div><p>أُفتح الباب! ✔</p></div>';
   setTimeout(function(){endQuiz(si);},600);
  },700);};
 if(mech==='match')matchMech(body,C.arr,win,gateMist);
 else if(mech==='fill')fillMech(body,C.arr,win,gateMist);
 else if(mech==='tf')tfMech(body,C.arr,win,gateMist);
 else if(mech==='timeline')timelineMech(body,C.arr,win,gateMist);
 else if(mech==='memory')memoryMech(body,{pairs:C.arr},win,gateMist);
 else if(mech==='sjig')sjigMech(body,{parts:C.arr},win,gateMist);
 else if(mech==='court')courtMech(body,C.obj,win,gateMist);
 else scaleMech(body,C.obj,win,gateMist);
 applyMod(body,mod);
}

function wheelRadius(n){var f=1;if(currentMode==='phone')f=.72;if(currentMode==='present')f=1.18;return Math.min(60+n*14,130)*f;}
function updateWheels(){QS.forEach(function(o){if(!o)return;var R=wheelRadius(o.segs.length);Array.prototype.forEach.call(o.wheel.querySelectorAll('.card'),function(c){c.style.setProperty('--R',(-R)+'px');});});}
function _applyModeBase(m){currentMode=m;document.body.classList.remove('mode-phone','mode-tablet','mode-present');document.body.classList.add('mode-'+m);updateWheels();updateProgress();applyScale();}

function fsSupported(){var el=document.documentElement;return !!(el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen);}
function fsActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement);}
function lockLand(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});}catch(e){}}
function enterFS(){var el=document.documentElement;
 var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
 if(!req)return false;
 try{var p=req.call(el);
  if(p&&p.then){p.then(lockLand).catch(function(){goImmersive();});}
  else lockLand();
  return true;
 }catch(e){return false;}}
function exitFS(){var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen;
 if(ex){try{ex.call(document);}catch(e){}}}
function iosGuide(){
 try{if(localStorage.getItem('nt_iosGuide'))return;localStorage.setItem('nt_iosGuide','1');}catch(e){}
 var g=document.createElement('div');
 g.style.cssText='position:fixed;inset:0;z-index:900;background:rgba(10,10,10,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px';
 g.innerHTML='<div style="background:#f5f5f5;border-radius:18px;max-width:430px;padding:22px;font-family:Tajawal,sans-serif;text-align:center;color:#0a0a0a">'
 +'<div style="font-size:2.2rem">📱</div><h3 style="margin:.4rem 0;font-size:1.1rem">الملء الكامل على الآيفون</h3>'
 +'<p style="font-size:.85rem;line-height:1.9;color:#2d2d2d">كل متصفحات الآيفون (حتى كروم) <b>ممنوعة</b> من ملء الشاشة بقرار من آبل.<br><b>الحل الوحيد لملء حقيقي:</b><br>١) افتح التطبيق من رابط خارجي (ليس Apps Script)<br>٢) مشاركة <b></b> ← <b>إضافة إلى الشاشة الرئيسية</b><br>٣) افتحه من الأيقونة → ملء كامل بلا أشرطة.</p>'
 +'<button id="iosGuideOk" style="margin-top:.6rem;background:linear-gradient(120deg,#dc2626,#991b1b);border:none;color:#fff;font-family:Tajawal,sans-serif;font-weight:800;padding:.6rem 1.6rem;border-radius:12px;cursor:pointer">فهمت ✨</button></div>';
 document.body.appendChild(g);
 g.querySelector('#iosGuideOk').onclick=function(){g.remove();};
}
function goImmersive(){document.body.classList.add('immersive');
 setTimeout(function(){window.scrollTo(0,1);},120);
 toast(isIOS||IN_FRAME?'✨ وضع الملء الذكي مفعّل\nسفاري الآيفون لا يدعم ملء الشاشة الويبّي':'✨ وضع الملء الذكي مفعّل');
 if(isIOS)iosGuide();}
function stopImmersive(){document.body.classList.remove('immersive');}
function toggleFS(){
 if(fsActive()){exitFS();stopImmersive();return;}
 if(document.body.classList.contains('immersive')){stopImmersive();return;}
 if(!isIOS&&!IN_FRAME&&fsSupported()){
  if(enterFS())return;
 }
 goImmersive();
}
addEventListener('resize',function(){updateWheels();applyScale();var s=null;try{s=localStorage.getItem(MODE_KEY);}catch(e){}if(!s)applyMode(detectMode());});

function rotateWheel(g,inst){var o=QS[g],w=o.wheel;if(!o||o.selP<0)return;if(inst){w.style.transition='none';Array.prototype.forEach.call(w.querySelectorAll('.card-in'),function(c){c.style.transition='none';});}w.style.setProperty('--rot',(-o.selP*o.step)+'deg');Array.prototype.forEach.call(w.querySelectorAll('.card-in'),function(c,i){c.classList.toggle('sel',i===o.selP);});if(inst){void w.offsetWidth;w.style.transition='';Array.prototype.forEach.call(w.querySelectorAll('.card-in'),function(c){c.style.transition='';});}o.pointer.classList.remove('bounce');void o.pointer.offsetWidth;o.pointer.classList.add('bounce');}
function showZoom(g,i){var o=QS[g],nm=imgSrc(o.sec+1,o.qi+1,i+1);var img=o.zoomimg;img.setAttribute('data-name',imgKey(o.sec+1,o.qi+1,i+1));img.onerror=function(){img.onerror=null;img.src=phSrc(img.getAttribute('data-name'));};img.src=nm;o.zoomtxt.textContent=SECTIONS[o.sec].qs[o.qi].a[i];o.zoombadge.textContent='فقرة '+arNum(i+1)+' من '+arNum(o.segs.length);o.zoomframe.classList.add('show');}

var tip=document.getElementById('tip');
function openTip(ti,si,anchor){var tm=SECTIONS[si].terms[ti];if(!tm)return;document.getElementById('tipT').textContent=tm.t;document.getElementById('tipD').textContent=tm.d;var r=anchor.getBoundingClientRect();tip.classList.add('show');var tw=tip.offsetWidth,th=tip.offsetHeight;var x=r.left+r.width/2-tw/2,y=r.top-th-10;x=Math.max(10,Math.min(innerWidth-tw-10,x));if(y<70)y=r.bottom+10;tip.style.left=x+'px';tip.style.top=y+'px';}

function currentSection(){var m=slideMeta[idx];return (m&&m.sec!==undefined)?m.sec:0;}

var fillEl=document.getElementById('fill'),orbEl=document.getElementById('orb');
function updateProgress(){var done=0;QS.forEach(function(o){if(o)done+=Object.keys(o.seen).length;});var pct=Math.round(done/totalSeg*100);
 document.getElementById('pct').textContent=arNum(pct)+'٪';
 var np=document.getElementById('npPct');if(np)np.textContent='التقدم: '+arNum(pct)+'٪';
 fillEl.style.height=pct+'%';orbEl.style.bottom=pct+'%';
 if(idx===N-1){document.getElementById('endPct').textContent=arNum(pct)+'٪';document.getElementById('endFill').style.width=pct+'%';document.getElementById('endMsg').textContent=pct===100?'أتقنت جميع العبارات ':pct>=60?'تقدم رائع 🌟':'عُد والمس العبارات ';}}
var idx=0;
function goTo(n){n=Math.max(0,Math.min(N-1,n));var ts=secOf(n);
 if(ts>=1&&ts<=SECTIONS.length-1&&!solved[ts-1]){toast(' حُلّ لغز قسم «'+SECTIONS[ts-1].name+'» أولًا!');return;}
 if(ts===SECTIONS.length&&!solved[SECTIONS.length-1]){toast('🔒 أكمل الألغاز أولًا!');return;}
 idx=n;visited[idx]=true;deck.style.setProperty('--idx',idx);
 slides.forEach(function(s,i){s.classList.toggle('act',i===idx);});
 document.getElementById('wm').textContent=slideMeta[idx].wm;
 clearParallax();updateProgress();refreshLocks();
 if(drawer.classList.contains('open'))fillDrawer(currentSection());}
function clearParallax(){slides.forEach(function(s){var q=s.querySelector('.qinner');if(q)q.style.transform='';});}
var sx=null,dragX=0,dragging=false,hInt=null,wasDrag=false,lastT=0,vel=0;
document.addEventListener('pointerdown',function(e){
 if(e.target.closest('.jz-piece,.tlcard,.sjpiece,.scard,.jz-veil.show,.quiz-veil.show,.drawer.open,.navPanel,.edgeMenu,input,textarea,select'))return;
 sx=e.clientX;dragX=0;dragging=false;hInt=null;vel=0;lastT=Date.now();deck.classList.remove('anim');
},true);
addEventListener('pointermove',function(e){if(sx===null)return;var dx=e.clientX-sx;if(hInt===null){if(Math.abs(dx)<12)return;hInt=true;}dragging=true;var d=dx;if((idx===0&&d>0)||(idx===N-1&&d<0))d=d/3;deck.style.setProperty('--drag',d+'px');var now=Date.now();if(now-lastT>0)vel=(dx-dragX)/(now-lastT);lastT=now;dragX=dx;var a=slides[idx].querySelector('.qinner');if(a)a.style.transform='translateX('+(dx*.12)+'px)';});
document.addEventListener('pointerup',function(e){if(sx===null)return;sx=null;deck.classList.add('anim');deck.style.setProperty('--drag','0px');
 if(dragging){var flick=Math.abs(vel)>0.4;if(Math.abs(dragX)>40||flick)goTo(idx+(dragX>0?1:-1));wasDrag=true;setTimeout(function(){wasDrag=false;},90);dragging=false;}
 clearParallax();},true);
